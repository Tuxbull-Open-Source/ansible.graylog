---
# Tested only by this role on the explicitly user-authorized Rocky Linux 10 lab.
graylog_version: '7.2'
mongodb_version: '8.0'
graylog_reconfigure: false

graylog_hostname: "{{ ansible_fqdn }}"
graylog_root_email: graylogadmin@example.invalid
# Required secret; supply through Ansible Vault or an approved secret manager.
graylog_admin_password: ''
graylog_root_timezone: UTC
graylog_cluster_name: graylog
graylog_mongodb_uri: "mongodb://localhost/{{ graylog_cluster_name }}"
graylog_http_bind_address: '127.0.0.1:9000'
graylog_http_publish_uri: "http://{{ graylog_hostname }}:9000/"

graylog_manage_nginx: false
