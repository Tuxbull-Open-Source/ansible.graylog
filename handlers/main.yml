---
- name: Restart graylog-server
  ansible.builtin.systemd:
    name: graylog-server
    state: restarted

- name: Restart graylog-datanode
  ansible.builtin.systemd:
    name: graylog-datanode
    state: restarted

- name: Restart mongod
  ansible.builtin.systemd:
    name: mongod
    state: restarted
