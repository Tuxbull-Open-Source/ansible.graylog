---
- name: Validate Graylog inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution_major_version | int == 10
      - graylog_admin_password | length >= 12
      - graylog_version is match('^[0-9]+\.[0-9]+$')
    fail_msg: >-
      This user-authorized lab role requires Rocky/RHEL 10, a Graylog major.minor
      version, and an administrator password supplied through a secret manager.
  no_log: true

- name: Check for existing Graylog installation
  ansible.builtin.package_facts:
    manager: auto

- name: Refuse unexpected existing Graylog installation
  ansible.builtin.assert:
    that:
      - graylog_reconfigure | bool or 'graylog-server' not in ansible_facts.packages
    fail_msg: >-
      Set graylog_reconfigure to true only for an explicitly approved existing
      installation.
